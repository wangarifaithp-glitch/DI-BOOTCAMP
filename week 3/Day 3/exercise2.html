<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work with forms</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        form {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <form id="userForm">
        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="firstname"><br>
        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lastname"><br><br>
        <input type="submit" value="Submit" id="submit">
    </form>

    <ul class="usersAnswer"></ul>

    <script>
        // 1. Retrieve the form and console.log it.
        const form = document.querySelector('form');
        console.log(form);

        // 2. Retrieve the inputs by their id and console.log them.
        const firstNameInput = document.getElementById('fname');
        const lastNameInput = document.getElementById('lname');
        console.log(firstNameInput);
        console.log(lastNameInput);

        // 3. Retrieve the inputs by their name attribute and console.log them.
        const inputsByName = document.getElementsByName('firstname');
        const inputsByName2 = document.getElementsByName('lastname');
        console.log(inputsByName);
        console.log(inputsByName2);

        // 4. When the user submits the form:
        form.addEventListener('submit', (event) => {
            // event.preventDefault() stops the form from refreshing the page.
            event.preventDefault();

            // Get the values of the input tags.
            const firstNameValue = firstNameInput.value.trim();
            const lastNameValue = lastNameInput.value.trim();

            // Make sure they are not empty.
            if (firstNameValue === '' || lastNameValue === '') {
                alert('Please fill in both first and last name.');
                return;
            }

            // Select the list to append the values to.
            const usersAnswer = document.querySelector('.usersAnswer');

            // Clear previous entries before adding new ones.
            usersAnswer.innerHTML = '';

            // Create one li per value and append them to the ul.
            const firstNameItem = document.createElement('li');
            firstNameItem.textContent = firstNameValue;
            usersAnswer.appendChild(firstNameItem);

            const lastNameItem = document.createElement('li');
            lastNameItem.textContent = lastNameValue;
            usersAnswer.appendChild(lastNameItem);
        });
    </script>
</body>
</html>
