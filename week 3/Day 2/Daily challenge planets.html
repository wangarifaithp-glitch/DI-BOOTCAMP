<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Challenge: Create a solar system</title>
        <style>
            body {
                background-color: black;
                padding: 20px;
                margin: 0;
                font-family: Arial, sans-serif;
            }

            .listPlanets {
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .planet {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                text-align: center;
                line-height: 100px;
                font-weight: bold;
                font-size: 12px;
                color: white;
                position: relative;
                border: 2px solid white;
                box-shadow: inset -10px -10px 15px rgba(0, 0, 0, 0.25);
            }

            .moon {
                position: absolute;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: rgb(237, 237, 237);
                border: 2px solid red;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }

            .mercury { background-color: #a8a8a8; }
            .venus { background-color: #d9b36d; }
            .earth { background-color: #3a70d8; }
            .mars { background-color: #d66a4d; }
            .jupiter { background-color: #c58b5d; }
            .saturn { background-color: #d8c590; }
            .uranus { background-color: #7ed5da; }
            .neptune { background-color: #4167d4; }
        </style>
    </head>
    <body>

    <section class="listPlanets"></section>

    <script src="Daily challenge planets.js"></script>
    </body>
</html>
