<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Giphy Search & Delete</title>
</head>
<body>

  <form id="search-form">
    <input type="text" id="category-input" placeholder="Search for a GIF category" required>
    <button type="submit">Fetch GIF</button>
  </form>

  <button id="delete-all-btn" style="margin-top: 10px;">Delete All GIFs</button>

  <div id="gif-container" style="margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px;"></div>

  <script src="script.js"></script>
</body>
</html>
