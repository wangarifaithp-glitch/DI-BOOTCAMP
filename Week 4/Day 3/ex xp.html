<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Forms and JSON Mario</title>
</head>
<body>
  <h1>Exercise 1: GET form</h1>
  <form method="get" action="ex xp.html">
    <label for="get-name">Name:</label>
    <input id="get-name" name="name" type="text" required />

    <label for="get-message">Message:</label>
    <textarea id="get-message" name="message" rows="5" cols="30" required></textarea>

    <input type="submit" value="Send" />
  </form>

  <h1>Exercise 2: POST form</h1>
  <form method="post" action="ex xp.html">
    <label for="post-name">Name:</label>
    <input id="post-name" name="name" type="text" required />

    <label for="post-message">Message:</label>
    <textarea id="post-message" name="message" rows="5" cols="30" required></textarea>

    <input type="submit" value="Send" />
  </form>

  <h1>Exercise 3: JSON Mario</h1>
  <pre id="json-output"></pre>

  <script src="ex xp.js"></script>
</body>
</html>
