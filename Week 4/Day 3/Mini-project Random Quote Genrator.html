<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #193238;
      --muted: #617276;
      --paper: #fffdf8;
      --cream: #f7f1e7;
      --teal: #176b6b;
      --coral: #e36b50;
      --line: #e4dace;
      --shadow: 0 20px 60px rgba(25, 50, 56, 0.13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, #f7f1e7 0%, #eef5f1 52%, #f8e9df 100%);
      font-family: "DM Sans", sans-serif;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0 80px;
    }

    header { margin-bottom: 30px; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--coral);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1, h2 { font-family: "Playfair Display", serif; }

    h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(2.6rem, 7vw, 5.2rem);
      line-height: 0.98;
      letter-spacing: -0.03em;
    }

    h2 { margin: 0 0 18px; font-size: 1.45rem; }

    #quote-display {
      position: relative;
      min-height: 280px;
      margin-bottom: 18px;
      padding: 48px clamp(24px, 7vw, 76px);
      overflow: hidden;
      border-radius: 18px;
      background: var(--ink);
      box-shadow: var(--shadow);
      color: var(--paper);
    }

    #quote-display::after {
      position: absolute;
      right: 28px;
      bottom: -42px;
      color: rgba(255, 253, 248, 0.08);
      content: "”";
      font-family: "Playfair Display", serif;
      font-size: 15rem;
      line-height: 1;
    }

    #quote-text {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 0 24px;
      font-family: "Playfair Display", serif;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      line-height: 1.2;
    }

    #quote-author, #quote-details, #status-message { position: relative; z-index: 1; }
    #quote-author { margin: 0 0 14px; color: #b9d8cf; font-weight: 600; }
    #quote-details { margin: 0; color: #d8e7df; font-size: 0.9rem; }
    #status-message { min-height: 1.3em; margin: 14px 0 0; color: #f4b29f; font-size: 0.9rem; }

    section:not(#quote-display) {
      margin-top: 18px;
      padding: 26px;
      border: 1px solid rgba(228, 218, 206, 0.9);
      border-radius: 14px;
      background: rgba(255, 253, 248, 0.82);
      box-shadow: 0 8px 28px rgba(25, 50, 56, 0.06);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 17px;
      color: white;
      background: var(--teal);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-2px); background: var(--coral); box-shadow: 0 8px 16px rgba(227, 107, 80, 0.22); }
    button:disabled { cursor: not-allowed; opacity: 0.4; }
    #generate-quote { padding: 14px 24px; background: var(--coral); }
    #generate-quote:hover { background: #c95740; }

    form { display: grid; gap: 10px; max-width: 600px; }
    label { color: var(--muted); font-size: 0.85rem; font-weight: 700; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--ink);
      background: white;
      font: inherit;
    }
    input:focus, textarea:focus { outline: 3px solid rgba(227, 107, 80, 0.2); border-color: var(--coral); }
    form button { justify-self: start; margin-top: 5px; }
    section > button { margin: 4px 6px 0 0; }

    @media (max-width: 600px) {
      main { padding-top: 38px; }
      #quote-display { min-height: 330px; padding: 32px 24px; }
      section:not(#quote-display) { padding: 22px 18px; }
      button { width: 100%; }
      section > button { margin: 5px 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">A small collection of big thoughts</p>
      <h1>Find a thought worth carrying.</h1>
    </header>

    <section id="quote-display" aria-live="polite">
      <p id="quote-text">Click “Generate Quote” to begin.</p>
      <p id="quote-author"></p>
      <p id="quote-details"></p>
      <p id="status-message"></p>
    </section>

    <button id="generate-quote" type="button">Generate Quote</button>

    <section>
      <h2>Add a quote</h2>
      <form id="add-quote-form">
        <label for="new-quote">Quote:</label>
        <textarea id="new-quote" name="quote" rows="4" required></textarea>

        <label for="new-author">Author:</label>
        <input id="new-author" name="author" type="text" required>

        <button type="submit">Add Quote</button>
      </form>
    </section>

    <section>
      <h2>Quote actions</h2>
      <button id="characters-with-spaces" type="button">Characters with spaces</button>
      <button id="characters-without-spaces" type="button">Characters without spaces</button>
      <button id="word-count" type="button">Word count</button>
      <button id="like-quote" type="button">Like</button>
    </section>

    <section>
      <h2>Find quotes by author</h2>
      <form id="filter-form">
        <label for="filter-author">Author:</label>
        <input id="filter-author" name="author" type="text" required>
        <button type="submit">Find Quotes</button>
      </form>
      <button id="previous-quote" type="button">Previous</button>
      <button id="next-quote" type="button">Next</button>
    </section>
  </main>

  <script src="Mini-project Random Quote Genrator.js"></script>
</body>
</html>
