<!DOCTYPE html>
<html lang="en">
<head>

  <title>Daily Challenge Form</title>
</head>
<body>
  <h1>Submit your details</h1>

  <div id="result"></div>

  <script src="Daily challenge html form.js"></script>
</body>
</html>
