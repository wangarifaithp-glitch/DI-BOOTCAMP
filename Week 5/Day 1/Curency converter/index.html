<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <link rel="stylesheet" href="sytle.css" />
</head>
<body>
  <main class="converter-card">
    <h1>Currency Converter</h1>
    <form id="converterForm">
      <div class="form-group">
        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" min="0" step="any" value="1" required />
      </div>
      <div class="form-group">
        <label for="fromCurrency">From</label>
        <select id="fromCurrency" name="fromCurrency"></select>
      </div>
      <div class="form-group">
        <label for="toCurrency">To</label>
        <select id="toCurrency" name="toCurrency"></select>
      </div>
      <div class="button-row">
        <button type="button" id="switchBtn">Switch</button>
        <button type="submit">Convert</button>
      </div>
    </form>
    <section id="result" class="result-container" aria-live="polite">Enter an amount to convert.</section>
  </main>
  <script src="script.js"></script>
</body>
</html>
