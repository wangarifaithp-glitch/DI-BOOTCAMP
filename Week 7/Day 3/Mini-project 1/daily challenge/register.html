<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #17241f; background: #f3f5ef; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 85% 12%, #d9ead7 0, transparent 34%), #f3f5ef; }
    main { width: min(100%, 480px); padding: 34px 36px; background: #fff; border: 1px solid #dce4dc; border-radius: 8px; box-shadow: 0 18px 50px #203b2d16; }
    .mark { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 20px; border-radius: 50%; background: #d9ead7; color: #26633f; font-size: 22px; }
    h1 { margin: 0 0 8px; font-family: Georgia, serif; font-size: 32px; font-weight: 500; }
    .intro { margin: 0 0 20px; color: #617068; line-height: 1.5; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    label { display: block; margin: 13px 0 6px; font-size: 14px; font-weight: 600; }
    input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #cbd6ce; border-radius: 5px; background: #fbfcfa; color: inherit; font: inherit; }
    input:focus { outline: 3px solid #b5d9bf; border-color: #378254; }
    .wide { grid-column: 1 / -1; }
    button { width: 100%; height: 46px; margin-top: 22px; border: 0; border-radius: 5px; background: #267449; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { background: #aab9ae; cursor: not-allowed; }
    #message { min-height: 24px; margin: 14px 0 0; color: #a3332e; font-size: 14px; line-height: 1.5; }
    #message[data-kind="success"] { color: #267449; }
    .switch { margin: 16px 0 0; color: #617068; text-align: center; font-size: 14px; }
    a { color: #267449; font-weight: 600; }
    @media (max-width: 480px) { main { padding: 28px 22px; } .fields { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">+</div>
    <h1>Create your account</h1>
    <p class="intro">A few details and you’re ready to go.</p>
    <form id="register-form">
      <div class="fields">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="given-name" required>
        </div>
        <div>
          <label for="lastName">Last Name</label>
          <input id="lastName" name="lastName" type="text" autocomplete="family-name" required>
        </div>
        <div class="wide">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="wide">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="30" required>
        </div>
        <div class="wide">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
      </div>
      <button id="submit-button" type="submit" disabled>Create account</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p class="switch">Already registered? <a href="/login.html">Sign in</a></p>
  </main>
  <script>
    const form = document.querySelector('#register-form');
    const submitButton = document.querySelector('#submit-button');
    const message = document.querySelector('#message');
    const inputs = [...form.querySelectorAll('input[required]')];

    function updateButton() {
      submitButton.disabled = !inputs.every((input) => input.value.trim().length > 0);
    }

    form.addEventListener('input', updateButton);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const result = await response.json();
        message.textContent = result.message || 'Unable to create your account.';
        message.dataset.kind = response.ok ? 'success' : 'error';
        if (response.ok) form.reset();
        updateButton();
      } catch {
        message.textContent = 'Unable to reach the server. Please try again.';
        message.dataset.kind = 'error';
      }
    });
  </script>
</body>
</html>
